[project]
name = "context-compress"
version = "0.1.0"
description = "Token-efficient compression for AI agent instruction files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click==8.1.8",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
tokens = [
    "tiktoken==0.9.0",
]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.6",
]

[project.scripts]
context-compress = "context_compress.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
